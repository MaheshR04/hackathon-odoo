version: '3.8'

services:
  dayflow-hrms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dayflow_hrms_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=dayflow_production_jwt_secure_key_2026
    volumes:
      # Persistent Volume Mapping for Authentication & Data Storage
      - ../server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
